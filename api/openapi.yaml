  /v1/projects/{project}/contexts/{name}/imports:
    post:
      operationId: contexts.imports
      tags: [hosted]
      summary: bind a cloud or uploaded table to a live context and import it
      description: |
        The table replaces the context's rows as one checkpoint, and the binding is
        kept for `refresh`. `source` is `upload://<digest>` for a table sent to
        `POST /snapshots`, or a cloud location the operator configured; `mapping`
        renames source columns to the context's, as `[context column, source
        column]` pairs. A retry of the same import answers as the first did.
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/context"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextImportRequest"
            examples:
              imported:
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-a032cc3b0fe7bf79f57751df525231ae
                  resource: {kind: context, name: customers}
                  payload:
                    context: customers
                    source: upload://sha256:5fb6a4c6f24bd5fb3623f97e3c62186e12e28e5b5fb6a4c6f24bd5fb3623f97e
                    format: arrow
                    digest: sha256:5fb6a4c6f24bd5fb3623f97e3c62186e12e28e5b5fb6a4c6f24bd5fb3623f97e
                    mapping: []
      responses:
        "200":
          description: the checkpoint the import wrote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportReceiptReply"
              examples:
                imported:
                  value:
