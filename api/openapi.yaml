                        files: {"model.safetensors": sha256:7a01c2e4b6d8f0a2c4e6f8a0b2d4f6a8c0e2f4a6b8d0f2a4c6e8f0a2b4d6f8a0}
                    snapshot: sha256:5fb6a4c6f24bd5fb3623f97e3c62186e12e28e5b5fb6a4c6f24bd5fb3623f97e
      responses:
        "200":
          description: the new revision; the same lock registers the same number again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionReply"
              examples:
                registered:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-8091a2b3c4d5e6f708192a3b4c5d6e7f
                    resource: {kind: predictor, name: churn}
                    result: {predictor: churn, number: 8, predictor_digest: sha256:0d1e2f30415263748596a7b8c9d0e1f2a3b4c5d6e7f8091a2b3c4d5e6f70819c, model: general-forecast/tabicl-v2-classifier, created_at: 1761400000.0, status: pending}

