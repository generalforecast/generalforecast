                    project: acme
                    request_id: r-a032cc3b0fe7bf79f57751df525231ae
                    resource: {kind: context, name: customers}
                    result:
                      context: customers
                      digest: sha256:5fb6a4c6f24bd5fb3623f97e3c62186e12e28e5b5fb6a4c6f24bd5fb3623f97e
                      rows: 1840
                      sequence: 2315
                      accepted_at: 1762000100.0
                      receipt: {project: acme, context: customers, write_id: import/r-1, operation: checkpoint, sequence: 2315, accepted_at: 1762000100.0, durably_accepted: true, changes: [], retry_valid_until: null}
                      mode: explicit-refresh
