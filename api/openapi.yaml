    InvitationId: {type: string, pattern: "^inv-[0-9a-f]{16}$"}
    WaitlistId: {type: string, pattern: "^wl-[0-9a-f]{16}$"}
    WorkspaceName: {type: string, minLength: 1, maxLength: 80, description: "a workspace's display name, without leading or trailing spaces"}
    UserCode: {type: string, minLength: 8, maxLength: 16, description: "the code `gf login` prints, `XXXX-XXXX` from BCDFGHJKLMNPQRSTVWXZ, taken in any case and with or without the dash"}
