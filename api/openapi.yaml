          items: {$ref: "#/components/schemas/Capability"}
        permission_inventory:
          type: array
          items: {$ref: "#/components/schemas/PermissionGrant"}
        bootstrap: {type: string, enum: [unconfigured, available, consumed]}
        key: {$ref: "#/components/schemas/KeyIdentity"}
        email: {type: [string, "null"]}
        machine: {type: [string, "null"]}
        workspace:
          oneOf:
            - $ref: "#/components/schemas/WorkspaceIdentity"
            - type: "null"

    AuthStatusReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
