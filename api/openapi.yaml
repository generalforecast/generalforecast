          description: each live context's schema and size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveContextListReply"
              examples:
                listed:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-2a3b4c5d6e7f8091a2b3c4d5e6f70819
                    resource: {kind: context, name: contexts}
                    result:
                      contexts:
                        - {name: customers, inputs: [spend, plan], targets: {churned: category}, max_rows: 100000, rows: 1840, labeled_rows: 1628, sequence: 2312, accepted_at: 1761400000.0}
    post:
      operationId: contexts.create
      tags: [hosted]
      summary: create a live context
      parameters:
        - $ref: "#/components/parameters/project"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveContextCreateRequest"
            examples:
              created:
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-3b4c5d6e7f8091a2b3c4d5e6f708192a
                  resource: {kind: context, name: customers}
                  payload: {name: customers, inputs: [spend, plan], targets: {churned: category}, max_rows: 100000}
      responses:
        "200":
          description: the empty live context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveContextReply"
              examples:
                created:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-3b4c5d6e7f8091a2b3c4d5e6f708192a
                    resource: {kind: context, name: customers}
                    result: {name: customers, inputs: [spend, plan], targets: {churned: category}, max_rows: 100000, rows: 0, labeled_rows: 0, sequence: 0, accepted_at: null}

  /v1/projects/{project}/contexts/{name}:
    get:
      operationId: contexts.show
      tags: [hosted]
      summary: show a live context
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/context"
      responses:
        "200":
          description: schema, size and the latest accepted sequence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveContextReply"
              examples:
                shown:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-4c5d6e7f8091a2b3c4d5e6f708192a3b
                    resource: {kind: context, name: customers}
                    result: {name: customers, inputs: [spend, plan], targets: {churned: category}, max_rows: 100000, rows: 1840, labeled_rows: 1628, sequence: 2312, accepted_at: 1761400000.0}

  /v1/projects/{project}/contexts/{name}/append:
    post:
      operationId: contexts.append
      tags: [hosted]
      summary: append rows to a live context
      description: |
        `write_id` makes the append idempotent; the same id with the same rows
        returns the original receipt. Rows carry the context's `id` column
        and inputs; labels arrive through `label`.
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/context"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveContextAppendRequest"
            examples:
              appended:
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-5d6e7f8091a2b3c4d5e6f708192a3b4c
                  resource: {kind: context, name: customers}
                  payload:
                    write_id: 2026-10-24T05:00:00Z-batch-1
                    rows:
                      - {customer_id: 1041, spend: 82.5, plan: pro}
                      - {customer_id: 1042, spend: 12.0, plan: free}
      responses:
        "200":
          description: durable acceptance, not serving visibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptReply"
              examples:
                appended:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-5d6e7f8091a2b3c4d5e6f708192a3b4c
                    resource: {kind: context, name: customers}
                    result: {context: customers, write_id: 2026-10-24T05:00:00Z-batch-1, operation: append, rows: 2, sequence: 2313, accepted_at: 1761400100.0, durably_accepted: true}

  /v1/projects/{project}/contexts/{name}/label:
    post:
      operationId: contexts.label
      tags: [hosted]
      summary: attach target values to rows already in a live context
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/context"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveContextLabelRequest"
            examples:
              labeled:
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-6e7f8091a2b3c4d5e6f708192a3b4c5d
                  resource: {kind: context, name: customers}
                  payload:
                    write_id: 2026-10-31T05:00:00Z-labels-1
                    target: churned
                    labels:
                      - {id: 1041, value: 0}
                      - {id: 1042, value: 1}
      responses:
        "200":
          description: durable acceptance, not serving visibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptReply"
              examples:
                labeled:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-6e7f8091a2b3c4d5e6f708192a3b4c5d
                    resource: {kind: context, name: customers}
                    result: {context: customers, write_id: 2026-10-31T05:00:00Z-labels-1, operation: label, rows: 2, sequence: 2314, accepted_at: 1762000000.0, durably_accepted: true}

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: an API key from `gf admin key create`, or the login token `gf login` stores

  parameters:
    project:
      name: project
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Name"}
      description: the project; `gf whoami` shows the one in use
    predictor:
      name: name
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Name"}
      description: the predictor's `name` from gf.yaml
    environment:
      name: environment
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Name"}
    key:
      name: key
      in: path
      required: true
      schema: {type: string, pattern: "^key-[0-9a-f]{20,24}$"}
    secret:
      name: secret
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Name"}
    context:
      name: name
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Name"}
      description: the live context's name

  responses:
    NotReady:
      description: a served model is still loading or compiling
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorReply"
          examples:
            loading:
              value:
                api_version: gf/v1
                project: acme
                request_id: r-9e0f1a2b3c4d5e6f708192a3b4c5d6e7
                resource: {kind: predictor, name: churn}
                error:
                  code: ModelNotReady
                  message: general-forecast/tabicl-v2-classifier is compiling 12 programs
                  hint: poll /healthz until it answers 200

  schemas:
    Name:
      type: string
      pattern: "^[a-z][a-z0-9-]{0,62}$"
      description: a resource name

    ModelId:
      type: string
      pattern: "^general-forecast/[a-z0-9][a-z0-9.-]*(@[^@\\s]+)?$"
      description: |
        a catalog model id, `general-forecast/<name>`, with an optional
        variant suffix (`@4*2`) or digest pin (`@sha256:<digest>`)

    Digest:
      type: string
      pattern: "^sha256:[0-9a-f]{64}$"

    Task:
      type: string
      enum: [classification, regression, forecast]

    ResourceKind:
      type: string
      enum: [predictor, model, project, api-key, secret, context]

    Resource:
      type: object
      description: what the envelope is about; GET lists use the collection name
      required: [kind, name]
      additionalProperties: false
      properties:
        kind: {$ref: "#/components/schemas/ResourceKind"}
        name: {type: string, minLength: 1, maxLength: 63}

    Envelope:
      type: object
      description: the fields every request and reply carries
      required: [api_version, project, request_id, resource]
      properties:
        api_version: {type: string, const: gf/v1}
        project: {$ref: "#/components/schemas/Name"}
        request_id: {type: string, minLength: 1, maxLength: 128, pattern: "^[\\x20-\\x7e]+$"}
        resource: {$ref: "#/components/schemas/Resource"}

    ErrorCode:
      type: string
      enum: [ValidationError, NotFound, Unauthorized, CapacityExceeded, ModelNotReady, Internal, Conflict]
      description: |
        ValidationError 422, NotFound 404, Unauthorized 401, CapacityExceeded
        422, ModelNotReady 503, Internal 500, Conflict 409 (a compare-and-swap
        on a stale generation)

    Error:
      type: object
      description: |
        `param` names the payload field (`target`, `inputs.plan`, `queries`);
        every limit error carries `limit` and `actual` and names the model in
        `message`. The request id is in the envelope.
      required: [code, message]
      additionalProperties: false
      properties:
        code: {$ref: "#/components/schemas/ErrorCode"}
        message: {type: string}
        reason:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
          description: |
            The finer reason behind `code`, when the service has one. A
            refused browser session says why with `reauthentication_required`,
            `link_confirmation_required`, `session_required` or
            `waitlist_required`.
        param: {type: string}
        hint: {type: string}
        limit: {type: integer}
        actual: {type: integer}

    ErrorReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [error]
          properties:
            error: {$ref: "#/components/schemas/Error"}

    Row:
      type: object
      description: one record; column names are keys, cells are scalars
      additionalProperties:
        type: [string, number, boolean, "null"]

    Inputs:
      type: object
      description: |
        inputs by rule rather than by list: `exclude` removes columns from the
        inferred set, `types` overrides inferred types; forecast predictors
        use `past` and `future` instead
      additionalProperties: false
      properties:
        exclude: {type: array, items: {type: string}}
        types:
          type: object
          additionalProperties: {$ref: "#/components/schemas/ColumnType"}
        past: {type: array, items: {type: string}}
        future: {type: array, items: {type: string}}

    ColumnType:
      type: string
      enum: [number, category, text, boolean, date, timestamp]

    Selection:
      type: object
      description: |
        which context rows a query sees; fractions below 1 are of the model's
        row cap, integers are rows; `core: null` is the whole table
      additionalProperties: false
      properties:
        core: {type: [number, "null"], default: 0.25}
        neighbors: {type: number, default: 0.75}
        kind: {type: string, enum: [stratified, random], default: stratified}
        recent: {type: [integer, "null"]}

    Manifest:
      type: object
      description: |
        the ad hoc predictor: the gf.yaml fields, with `context` and `queries`
        as rows instead of a context declaration; `name` and `resources` are
        file-only
      required: [model, target, context, queries]
      additionalProperties: false
      properties:
        model: {$ref: "#/components/schemas/ModelId"}
        target: {type: string}
        id: {type: string}
        inputs:
          oneOf:
            - type: array
              items: {type: string}
            - $ref: "#/components/schemas/Inputs"
        time: {type: string}
        series: {type: array, items: {type: string}}
        frequency:
          oneOf:
            - {type: string, pattern: "^[1-9][0-9]*(s|min|h|d|w)$"}
            - {type: number, exclusiveMinimum: 0}
          description: "`1d`, `1h`, `7d`, or seconds as a number"
        horizon: {type: integer, minimum: 1}
        quantiles:
          type: array
          items: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1}
          default: [0.1, 0.5, 0.9]
        outputs:
          type: array
          items: {type: string, enum: [label, value, probabilities, quantiles]}
          description: defaults by task; classification label+probabilities, regression value, forecast value+quantiles
        selection: {$ref: "#/components/schemas/Selection"}
        context:
          type: array
          items: {$ref: "#/components/schemas/Row"}
        queries:
          type: array
          items: {$ref: "#/components/schemas/Row"}
          minItems: 1

    ManifestRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/Manifest"}

    Queries:
      type: object
      description: |
        the declared predictor payload; `context` only when the manifest
        declares `context: {request: ...}`
      required: [queries]
      additionalProperties: false
      properties:
        queries:
          type: array
          items: {$ref: "#/components/schemas/Row"}
          minItems: 1
        context:
          type: array
          items: {$ref: "#/components/schemas/Row"}
        as_of:
          type: string
          format: date-time
          description: for a live context, score against the rows accepted at or before this instant

    QueriesRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/Queries"}

    ContextKind:
      type: string
      enum: [snapshot, request, live]

    ContextInfo:
      type: object
      description: the context a prediction actually used
      required: [kind, rows]
      additionalProperties: false
      properties:
        kind: {$ref: "#/components/schemas/ContextKind"}
        rows: {type: integer, minimum: 0}
        digest: {$ref: "#/components/schemas/Digest"}
        as_of: {type: string, format: date-time}

    Prediction:
      type: object
      description: |
        the query's id under the manifest's id column name when it declares
        one (omitted when it does not); `label` and `probabilities` for
        classification, `value` for regression, `value` and `quantiles` for
        forecasts
      additionalProperties: {type: [string, integer]}
      properties:
        label: {type: [string, integer, boolean]}
        value: {type: number}
        probabilities:
          type: object
          additionalProperties: {type: number}
        quantiles:
          type: object
          additionalProperties: {type: number}

    Result:
      type: object
      required: [model, task, context, predictions]
      additionalProperties: false
      properties:
        model: {$ref: "#/components/schemas/ModelId"}
        task: {$ref: "#/components/schemas/Task"}
        context: {$ref: "#/components/schemas/ContextInfo"}
        revision: {type: integer, minimum: 1}
        environment: {$ref: "#/components/schemas/Name"}
        predictions:
          type: array
          items: {$ref: "#/components/schemas/Prediction"}

    ResultReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Result"}

    Limits:
      type: object
      description: the most a model accepts in one call
      required: [context_rows, queries, inputs]
      additionalProperties: false
      properties:
        context_rows: {type: integer, minimum: 1}
        queries: {type: integer, minimum: 1}
        inputs: {type: integer, minimum: 1}

    Shape:
      type: object
      description: a compiled program's shape
      required: [context_rows, queries, inputs]
      additionalProperties: false
      properties:
        context_rows: {type: integer, minimum: 1}
        queries: {type: integer, minimum: 1}
        inputs: {type: integer, minimum: 1}
        classes: {type: integer, minimum: 2}

    Input:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name: {type: string}
        type: {$ref: "#/components/schemas/ColumnType"}

    ContextLock:
      type: object
      description: the context as gf.lock pins it
      required: [kind]
      additionalProperties: false
      properties:
        kind: {$ref: "#/components/schemas/ContextKind"}
        rows: {type: integer, minimum: 0}
        query_rows: {type: integer, minimum: 0}
        digest: {$ref: "#/components/schemas/Digest"}
        live: {$ref: "#/components/schemas/Name"}
        max_rows: {type: integer, minimum: 1}

    ResolvedSelection:
      type: object
      description: the selection as gf.lock pins it, in rows
      required: [core, neighbors, kind]
      additionalProperties: false
      properties:
        core: {type: [integer, "null"]}
        neighbors: {type: integer, minimum: 0}
        kind: {type: string, enum: [stratified, random]}
        recent: {type: [integer, "null"]}

    Resolution:
      type: object
      description: the resolved predictor gf check prints and gf.lock pins
      required: [name, model, model_digest, task, target, target_type, inputs, context, selection]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}
        model: {$ref: "#/components/schemas/ModelId"}
        model_digest: {$ref: "#/components/schemas/Digest"}
        task: {$ref: "#/components/schemas/Task"}
        target: {type: string}
        target_type: {$ref: "#/components/schemas/ColumnType"}
        classes: {type: array, items: {type: string}}
        id: {type: string}
        time: {type: string}
        series: {type: array, items: {type: string}}
        inputs:
          type: array
          items: {$ref: "#/components/schemas/Input"}
        context: {$ref: "#/components/schemas/ContextLock"}
        selection: {$ref: "#/components/schemas/ResolvedSelection"}

    Serving:
      type: object
      description: whether this server has the predictor's model loaded and compiled
      required: [loaded, compiled, warm_shapes]
      additionalProperties: false
      properties:
        loaded: {type: boolean}
        compiled: {type: boolean}
        warm_shapes:
          type: array
          items: {$ref: "#/components/schemas/Shape"}

    Predictor:
      allOf:
        - $ref: "#/components/schemas/Resolution"
        - type: object
          required: [limits, environments, serving]
          properties:
            limits: {$ref: "#/components/schemas/Limits"}
            environments:
              type: array
              items: {$ref: "#/components/schemas/Environment"}
            serving: {$ref: "#/components/schemas/Serving"}

    PredictorReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Predictor"}

    PredictorList:
      type: object
      required: [predictors]
      additionalProperties: false
      properties:
        predictors:
          type: array
          items: {$ref: "#/components/schemas/Predictor"}

    PredictorListReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/PredictorList"}

    Model:
      type: object
      description: |
        the catalog's description of a served model: `model` is the resolved
        id with its content digest, `limits` what one call may send here,
        `warm_shapes` the shapes compiled at startup
      required: [model, name, task, artifact, bounds, capabilities, runtime, license, repository, revision, limits, warm_shapes]
      additionalProperties: false
      properties:
        model: {type: string, description: "`general-forecast/<name>@sha256:<digest>`"}
        name: {$ref: "#/components/schemas/ModelId"}
        task: {$ref: "#/components/schemas/Task"}
        repository: {type: string}
        revision: {type: string}
        license: {type: string}
        runtime: {type: string, enum: [cpu, gpu]}
        artifact: {$ref: "#/components/schemas/Artifact"}
        artifact_verification: {type: string}
        bounds:
          type: object
          description: the model's own caps, before this server's limits
          additionalProperties: {type: [integer, number, "null"]}
        capabilities:
          type: array
          items: {$ref: "#/components/schemas/Capability"}
        limits: {$ref: "#/components/schemas/Limits"}
        warm_shapes:
          type: array
          items: {$ref: "#/components/schemas/Shape"}

    Artifact:
      type: object
      required: [repository, revision, digest, license, files]
      additionalProperties: true
      properties:
        repository: {type: string}
        revision: {type: string}
        digest: {$ref: "#/components/schemas/Digest"}
        license: {type: string}
        digest_format: {type: string}
        files:
          type: object
          additionalProperties: {type: string}

    Capability:
      type: object
      required: [name, state]
      additionalProperties: false
      properties:
        name: {type: string}
        state: {type: string, enum: [supported, unsupported]}
        code: {type: [string, "null"]}
        reason: {type: [string, "null"]}

    ModelList:
      type: object
      required: [models]
      additionalProperties: false
      properties:
        models:
          type: array
          items: {$ref: "#/components/schemas/Model"}

    ModelListReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/ModelList"}

    Health:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: {type: string, const: ok}

    HealthError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error: {$ref: "#/components/schemas/Error"}

    # -- hosted control plane ------------------------------------------------

    Empty:
      type: object
      additionalProperties: false

    EmptyRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/Empty"}

    Project:
      type: object
      required: [name, organization]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}
        organization: {$ref: "#/components/schemas/Name"}

    ProjectReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Project"}

    ProjectList:
      type: object
      required: [projects, organizations]
      additionalProperties: false
      properties:
        projects:
          type: array
          items: {$ref: "#/components/schemas/Project"}
        organizations:
          type: array
          items: {$ref: "#/components/schemas/Name"}

    ProjectListReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/ProjectList"}

    ProjectCreate:
      type: object
      required: [name, organization]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}
        organization: {$ref: "#/components/schemas/Name"}

    ProjectCreateRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/ProjectCreate"}

    Permission:
      type: string
      enum:
        - predictors:read
        - predictors:write
        - predictors:predict
        - contexts:read
        - contexts:write
        - contexts:history
        - sources:read
        - sources:write
        - models:read
        - keys:read
        - keys:write
        - secrets:read
        - secrets:write

    Key:
      type: object
      description: "`token` is present only in the create and rotate replies"
      required: [id, project, name, permissions, created_at, expires_at, revoked_at]
      additionalProperties: false
      properties:
        id: {type: string, pattern: "^key-[0-9a-f]{20,24}$"}
        project: {$ref: "#/components/schemas/Name"}
        name: {$ref: "#/components/schemas/Name"}
        permissions:
          type: array
          items: {$ref: "#/components/schemas/Permission"}
        created_at: {type: number}
        expires_at: {type: number}
        revoked_at: {type: [number, "null"]}
        token: {type: string, pattern: "^gf_[A-Za-z0-9_-]{32,}$"}
        replaces: {type: string, pattern: "^key-[0-9a-f]{20,24}$"}

    KeyReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Key"}

    KeyList:
      type: object
      required: [keys]
      additionalProperties: false
      properties:
        keys:
          type: array
          items: {$ref: "#/components/schemas/Key"}

    KeyListReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/KeyList"}

    KeyCreate:
      type: object
      required: [name, permissions]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}
        permissions:
          type: array
          items: {$ref: "#/components/schemas/Permission"}
          minItems: 1
        expires_in:
          type: number
          minimum: 60
          maximum: 7776000
          default: 2592000
          description: seconds; 30 days by default, 90 at most

    KeyCreateRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/KeyCreate"}

    KeyRef:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id: {type: string, pattern: "^key-[0-9a-f]{20,24}$"}

    KeyRefRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/KeyRef"}

    KeyRevoked:
      type: object
      required: [id, revoked]
      additionalProperties: false
      properties:
        id: {type: string}
        revoked: {type: boolean, const: true}

    KeyRevokedReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/KeyRevoked"}

    Secret:
      type: object
      description: metadata only; a value is never returned
      required: [project, name, version, created_at, updated_at]
      additionalProperties: false
      properties:
        project: {$ref: "#/components/schemas/Name"}
        name: {$ref: "#/components/schemas/Name"}
        version: {type: integer, minimum: 1}
        created_at: {type: number}
        updated_at: {type: number}

    SecretReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Secret"}

    SecretList:
      type: object
      required: [secrets]
      additionalProperties: false
      properties:
        secrets:
          type: array
          items: {$ref: "#/components/schemas/Secret"}

    SecretListReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/SecretList"}

    SecretCreate:
      type: object
      required: [name, value]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}
        value: {type: string, minLength: 1, maxLength: 65536}

    SecretCreateRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/SecretCreate"}

    SecretRotate:
      type: object
      required: [name, value, expected_version]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}
        value: {type: string, minLength: 1, maxLength: 65536}
        expected_version: {type: integer, minimum: 1}

    SecretRotateRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/SecretRotate"}

    SecretRef:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}

    SecretRefRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/SecretRef"}

    SecretDeleted:
      type: object
      required: [name, deleted]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}
        deleted: {type: boolean, const: true}

    SecretDeletedReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/SecretDeleted"}

    State:
      type: string
      enum: [pending, building, ready, failed, stopped]

    Revision:
      type: object
      description: an immutable pushed predictor
      required: [predictor, number, predictor_digest, model, created_at, status]
      additionalProperties: false
      properties:
        predictor: {$ref: "#/components/schemas/Name"}
        number: {type: integer, minimum: 1}
        predictor_digest: {$ref: "#/components/schemas/Digest"}
        model: {$ref: "#/components/schemas/ModelId"}
        created_at: {type: number}
        status: {$ref: "#/components/schemas/State"}

    RevisionReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Revision"}

    RevisionList:
      type: object
      required: [revisions]
      additionalProperties: false
      properties:
        revisions:
          type: array
          items: {$ref: "#/components/schemas/Revision"}

    RevisionListReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/RevisionList"}

    LockedModel:
      type: object
      required: [files]
      additionalProperties: false
      properties:
        files:
          type: object
          additionalProperties: {$ref: "#/components/schemas/Digest"}

    Lock:
      type: object
      description: gf.lock
      required: [lock_version, predictor, model]
      additionalProperties: false
      properties:
        lock_version: {type: integer, const: 1}
        predictor: {$ref: "#/components/schemas/Resolution"}
        model: {$ref: "#/components/schemas/LockedModel"}

    RevisionRegister:
      type: object
      required: [lock, snapshot]
      additionalProperties: false
      properties:
        lock: {$ref: "#/components/schemas/Lock"}
        snapshot:
          oneOf:
            - $ref: "#/components/schemas/Digest"
            - type: "null"

    RevisionRegisterRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/RevisionRegister"}

    RevisionDetails:
      type: object
      required: [revision, lock]
      additionalProperties: false
      properties:
        revision: {$ref: "#/components/schemas/Revision"}
        lock: {$ref: "#/components/schemas/Lock"}

    RevisionDetailsReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/RevisionDetails"}

    Environment:
      type: object
      description: a pointer to a revision; `generation` guards promote and rollback
      required: [predictor, name, revision, generation, runtime, status]
      additionalProperties: false
      properties:
        predictor: {$ref: "#/components/schemas/Name"}
        name: {$ref: "#/components/schemas/Name"}
        revision: {type: [integer, "null"]}
        generation: {type: integer, minimum: 0}
        runtime: {$ref: "#/components/schemas/Name"}
        status: {$ref: "#/components/schemas/State"}

    EnvironmentReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Environment"}

    EnvironmentList:
      type: object
      required: [environments]
      additionalProperties: false
      properties:
        environments:
          type: array
          items: {$ref: "#/components/schemas/Environment"}

    EnvironmentListReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/EnvironmentList"}

    EnvironmentCreate:
      type: object
      required: [name, runtime]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}
        runtime: {$ref: "#/components/schemas/Name"}

    EnvironmentCreateRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/EnvironmentCreate"}

    Promote:
      type: object
      required: [revision, expected_generation]
      additionalProperties: false
      properties:
        revision: {type: integer, minimum: 1}
        expected_generation: {type: integer, minimum: 0}

    PromoteRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/Promote"}

    Metrics:
      type: object
      description: |
        serving facts: `context` is the context the environment is serving
        now, `accepted_version`/`serving_version` compare the newest accepted
        write of a live context with the one being served, `fresh` says
        whether they agree (null without a context)
      required: [status, context, accepted_version, serving_version, fresh, requests, errors, mean_latency_seconds]
      additionalProperties: false
      properties:
        status: {$ref: "#/components/schemas/State"}
        context:
          oneOf:
            - $ref: "#/components/schemas/ServingContext"
            - type: "null"
        accepted_version: {type: [integer, string, "null"]}
        serving_version: {type: [integer, string, "null"]}
        fresh: {type: [boolean, "null"]}
        requests: {type: integer, minimum: 0}
        errors: {type: integer, minimum: 0}
        mean_latency_seconds: {type: [number, "null"]}

    ServingContext:
      type: object
      description: |
        the context an environment serves: `source` is `snapshot`,
        `request` or `live/<context>`; the version fields and
        `freshness_lag_seconds` are set for live contexts
      required: [source, version, rows, as_of, accepted_version, serving_version, freshness_lag_seconds]
      additionalProperties: true
      properties:
        source: {type: string}
        version: {type: [integer, string, "null"]}
        rows: {type: integer, minimum: 0}
        as_of: {type: [number, "null"]}
        accepted_version: {type: [integer, string, "null"]}
        serving_version: {type: [integer, string, "null"]}
        freshness_lag_seconds: {type: [number, "null"]}

    MetricsReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Metrics"}

    LogEntry:
      type: object
      required: [at, code]
      additionalProperties: false
      properties:
        at: {type: number}
        code: {type: string}

    Logs:
      type: object
      required: [logs]
      additionalProperties: false
      properties:
        logs:
          type: array
          items: {$ref: "#/components/schemas/LogEntry"}

    LogsReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Logs"}

    PredictorDeleted:
      type: object
      required: [name, deleted]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}
        deleted: {type: boolean, const: true}

    PredictorDeletedReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/PredictorDeleted"}

    LiveContext:
      type: object
      description: a hosted, appendable context
      required: [name, inputs, targets, max_rows, rows, labeled_rows, sequence, accepted_at]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}
        inputs: {type: array, items: {type: string}}
        targets:
          type: object
          additionalProperties: {$ref: "#/components/schemas/ColumnType"}
        max_rows: {type: integer, minimum: 1}
        rows: {type: integer, minimum: 0}
        labeled_rows: {type: integer, minimum: 0}
        sequence: {type: integer, minimum: 0}
        accepted_at: {type: [number, "null"]}

    LiveContextReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/LiveContext"}

    LiveContextList:
      type: object
      required: [contexts]
      additionalProperties: false
      properties:
        contexts:
          type: array
          items: {$ref: "#/components/schemas/LiveContext"}

    LiveContextListReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/LiveContextList"}

    LiveContextCreate:
      type: object
      required: [name, inputs, targets]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}
        inputs: {type: array, items: {type: string}, minItems: 1}
        targets:
          type: object
          additionalProperties: {$ref: "#/components/schemas/ColumnType"}
          minProperties: 1
        max_rows: {type: integer, minimum: 1, default: 100000}

    LiveContextCreateRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/LiveContextCreate"}

    LiveContextAppend:
      type: object
      required: [write_id, rows]
      additionalProperties: false
      properties:
        write_id: {type: string, minLength: 1, maxLength: 256}
        rows:
          type: array
          items: {$ref: "#/components/schemas/Row"}
          minItems: 1

    LiveContextAppendRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/LiveContextAppend"}

    Label:
      type: object
      required: [id, value]
      additionalProperties: false
      properties:
        id: {type: [string, integer]}
        value: {type: [string, number, boolean]}

    LiveContextLabel:
      type: object
      required: [write_id, target, labels]
      additionalProperties: false
      properties:
        write_id: {type: string, minLength: 1, maxLength: 256}
        target: {type: string}
        labels:
          type: array
          items: {$ref: "#/components/schemas/Label"}
          minItems: 1

    LiveContextLabelRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/LiveContextLabel"}

    Receipt:
      type: object
      description: durable acceptance of an append or label write
      required: [context, write_id, operation, rows, sequence, accepted_at, durably_accepted]
      additionalProperties: false
      properties:
        context: {$ref: "#/components/schemas/Name"}
        write_id: {type: string}
        operation: {type: string, enum: [append, label]}
        rows: {type: integer, minimum: 0}
        sequence: {type: integer, minimum: 0}
        accepted_at: {type: number}
        durably_accepted: {type: boolean}

    ReceiptReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Receipt"}
