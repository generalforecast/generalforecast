                    result:
                      events:
                        - {sequence: 412, at: 1762000000.0, actor: 'api-key:key-0f1e2d3c4b5a69788796', project: acme, action: keys.create, target: key-0a1b2c3d4e5f6a7b8c9d, outcome: allowed}

  /v1/cli-logins:
    post:
      operationId: logins.start
      tags: [hosted]
      x-gf-envelope: false
      security: []
      summary: start a CLI login, to approve in a signed-in browser
      description: |
        The device flow of RFC 8628, outside the envelope: no credential, no
        project. The user opens `verification_uri_complete`, signs in and approves
        the code, while the CLI polls `/v1/cli-logins/token` every `interval`
        seconds with `device_code`, the only credential the login has.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CliLoginStart"
            examples:
              login:
                value: {machine: tejas-mbp}
      responses:
        "200":
          description: the next step of the login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliLoginGrant"
              examples:
                login:
                  value:
                    device_code: gf_dc_0123456789abcdefghijklmnopqrstuvwxyzABCDEFG
                    user_code: WDJB-MJHT
                    verification_uri: https://app.generalforecast.com/cli
                    verification_uri_complete: https://app.generalforecast.com/cli?code=WDJB-MJHT
                    expires_in: 600
                    interval: 5
        "429":
          description: "too many logins are pending; try again shortly"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginErrorReply"

  /v1/cli-logins/token:
    post:
      operationId: logins.token
      tags: [hosted]
      x-gf-envelope: false
      security: []
      summary: redeem an approved CLI login for an API key, once
      description: |
        Until the browser decides, a poll answers 400 with the reason
        `authorization_pending`, or `slow_down` when it comes sooner than
        `interval` allows, which then grows by 5 seconds. A denied login answers
        403 with `access_denied`, and an expired or redeemed code 400 with
        `expired_token`. An approved one answers once with the key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CliLoginPoll"
            examples:
              login:
                value: {device_code: gf_dc_0123456789abcdefghijklmnopqrstuvwxyzABCDEFG}
      responses:
        "200":
          description: the next step of the login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliLoginToken"
              examples:
                login:
                  value:
                    access_token: gf_0123456789abcdefghijklmnopqrstuvwxyzABCDEFG
                    token_type: bearer
                    key: {id: key-0f1e2d3c4b5a69788796aabb, name: cli-tejas-mbp, project: acme, expires_at: 1769076000.0}
                    email: tejas@example.com
                    workspace: {id: acme-inc, display_name: Acme Inc}
                    project: acme
        "400":
          description: "not yet, too soon, or no longer: the error's reason says which"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginErrorReply"
              examples:
                refused:
                  value:
                    error: {code: Unauthorized, message: waiting for browser approval, reason: authorization_pending}

