                  payload: {path: exports/customers.csv, format: csv, mapping: {key: customer_id, features: {spend: spend, plan: plan}, labels: {churned: churned}, label_types: {churned: boolean}}}
      responses:
        "200":
          description: the immutable pin
          content:
