                    snapshot: sha256:5fb6a4c6f24bd5fb3623f97e3c62186e12e28e5b5fb6a4c6f24bd5fb3623f97e
      responses:
        "200":
          description: the new revision; the same lock registers the same number again
          content:
            application/json:
              schema:
