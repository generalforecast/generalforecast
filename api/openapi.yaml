  /v1/projects/{project}/snapshots:
    post:
      operationId: snapshots.upload
      tags: [hosted]
      summary: upload a table as an Arrow stream, for a context or a revision to name by digest
      description: |
        The body is an Arrow IPC stream, not an envelope, so the request id
        and project ride in headers; the reply is enveloped as any other.
        At most 100,000 rows and 32 MiB. The digest is of the normalized
        table, so a client can check it against its own.
      parameters:
        - $ref: "#/components/parameters/project"
        - name: X-GF-Request-ID
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: X-GF-Project
          in: header
          required: true
          schema: {$ref: "#/components/schemas/Name"}
      requestBody:
        required: true
        content:
          application/vnd.apache.arrow.stream:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: the stored table's digest and row count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadReceiptReply"
              examples:
                uploaded:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-1c4524901f88a3b4730006b3bf14c7fc
                    resource: {kind: context, name: snapshots}
                    result: {digest: 'sha256:5fb6a4c6f24bd5fb3623f97e3c62186e12e28e5b5fb6a4c6f24bd5fb3623f97e', rows: 1840}

  /v1/auth/status:
    get:
      operationId: auth.status
      tags: [hosted]
      summary: who the credential acts for, and what the server offers
      description: |
        The credential's principal, the sign-in providers and capabilities the
        server has configured, and the permissions keys may be granted. An API key
        also shows itself, and, for a key `gf login` minted, the email, machine and
        workspace it was approved for. Like every route under `/v1` outside a
        project, it names the client's project in the envelope and in
        `X-GF-Project`.
      responses:
        "200":
          description: the credential and the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatusReply"
              examples:
                signed-in:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-753345f08b0c2044ea63a96b5f4fa2ef
                    resource: {kind: workspace, name: auth}
                    result:
                      authenticated: true
                      principal: {kind: api-key, id: key-0f1e2d3c4b5a69788796, project: acme}
                      google: configured
                      sign_in: [google, github]
                      secrets: configured
                      capabilities:
                        - {name: api-keys, state: supported}
                        - {name: enterprise-sso, state: unsupported, code: EnterpriseSSOUnavailable, reason: per-company IdP connections are not implemented}
                      permission_inventory:
                        - {name: predictors:predict, description: Predict with predictors, enforced: true, roles: [admin, editor, scorer]}
                        - {name: sso:write, description: Reserved; SSO changes need an account admin, enforced: false, roles: [admin]}
                      bootstrap: consumed
                      key: {id: key-0f1e2d3c4b5a69788796, name: cli-tejas-mbp, project: acme, expires_at: 1769076000.0}
                      email: tejas@example.com
                      machine: tejas-mbp
                      workspace: {id: acme-inc, display_name: Acme Inc}

