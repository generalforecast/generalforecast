        events:
          type: array
          items: {$ref: "#/components/schemas/AuditEvent"}

    AuditLogReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/AuditLog"}

