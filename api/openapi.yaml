    post:
      operationId: revisions.register
      tags: [hosted]
      summary: register a revision from a checked lock and its uploaded snapshot
      description: |
        `gf push` uploads the snapshot bytes first (Arrow IPC, outside this
        JSON surface), then registers the lock. `snapshot` is the uploaded
        context digest, or null for `request` and `live` contexts.
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/predictor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionRegisterRequest"
            examples:
              registered:
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-8091a2b3c4d5e6f708192a3b4c5d6e7f
                  resource: {kind: predictor, name: churn}
                  payload:
                    lock:
                      lock_version: 1
                      predictor:
                        name: churn
                        model: general-forecast/tabicl-v2-classifier
                        model_digest: sha256:7a01c2e4b6d8f0a2c4e6f8a0b2d4f6a8c0e2f4a6b8d0f2a4c6e8f0a2b4d6f8a0
                        task: classification
                        target: churned
                        target_type: category
                        classes: ["0", "1"]
                        id: customer_id
                        inputs:
                          - {name: spend, type: number}
                          - {name: plan, type: category}
                        context: {kind: snapshot, rows: 1840, query_rows: 212, digest: sha256:5fb6a4c6f24bd5fb3623f97e3c62186e12e28e5b5fb6a4c6f24bd5fb3623f97e}
                        selection: {core: 1000, neighbors: 3000, kind: stratified}
