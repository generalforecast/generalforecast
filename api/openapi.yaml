      type: object
      description: |
        why a CLI login cannot go on, outside the envelope as the login is.
        `reason` says which: `authorization_pending` (`Unauthorized`, poll
        again), `slow_down` (`ValidationError`, poll less often),
        `expired_token` and `access_denied` (`Unauthorized`, start again) or
        `rate_limited` (`CapacityExceeded`).
      required: [error]
      additionalProperties: false
      properties:
        error: {$ref: "#/components/schemas/Error"}

