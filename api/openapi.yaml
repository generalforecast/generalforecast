        organization: {$ref: "#/components/schemas/Name"}
        provider: {type: string, const: google}
        providers:
          type: array
          items: {type: string, enum: [google, microsoft, github]}
        enabled: {type: boolean}
        configured: {type: boolean, description: whether the server can sign anyone in}
        membership_required: {type: boolean, const: true}

    SsoReply:
      allOf:
