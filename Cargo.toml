[workspace]
members = ["crates/gf-assign", "crates/gf-cli", "crates/gf-core", "crates/gf-py", "crates/gf-router", "crates/gf-server"]
resolver = "3"

[workspace.package]
# The one version: every crate takes it, and pyproject.toml's must equal it
# (tests/test_repository.py).
version = "0.1.13"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
strip = true
