name: Release

# Publishes wheels for macOS on Apple silicon and Linux on x86_64 and arm64,
# with the versioned gf-native client, as assets of the tag's GitHub release.
# Actions are pinned by commit.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read

  wheels:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Only the canonical versioned client is an executable wheel asset. The
      # native extension and Python workers need no server/router executable.
      - if: runner.os == 'macOS'
        run: |
          cargo build --release --locked -p gf-cli --bin gf
          mkdir -p wheel-data/scripts
          cp target/release/gf wheel-data/scripts/gf-native
          sed -i '' 's/^# data = "wheel-data"/data = "wheel-data"/' pyproject.toml
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --locked --out dist
          before-script-linux: |
            cargo build --release --locked -p gf-cli --bin gf
            mkdir -p wheel-data/scripts
            cp target/release/gf wheel-data/scripts/gf-native
            sed -i 's/^# data = "wheel-data"/data = "wheel-data"/' pyproject.toml
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.8.0"
      - name: Install the wheel and run what it carries
        run: |
          uv venv smoke
          uv pip install --python smoke/bin/python dist/*.whl
          smoke/bin/gf --help
          smoke/bin/gf-native --help
          smoke/bin/gf serve --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  assets:
    needs: wheels
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: Attach the wheels to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.whl --clobber --repo "$GITHUB_REPOSITORY"
