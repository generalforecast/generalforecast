name: Release

# Builds wheels for macOS on Apple silicon and Linux on x86_64 and arm64, with
# the versioned gf-native client. A v* tag that matches pyproject.toml's version
# publishes them to PyPI through Trusted Publishing and attaches them to the
# tag's GitHub release. Wheels are built only once every CI check passes on
# the tagged tree, and nothing is published, attached or uploaded until the
# tests marked slow pass too. Actions are pinned by commit.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Every job of ci.yml, whatever the tag's commit changed.
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      everything: true
    permissions:
      actions: read
      contents: read
      pull-requests: read

  # The tests marked slow, which compile models and start servers.
  slow:
    uses: ./.github/workflows/weekly.yml
    permissions:
      contents: read

  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: startsWith(github.ref, 'refs/tags/v')
        name: Check the tag matches the package version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi

  wheels:
    needs: [version, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The versioned client is the wheel's executable beside Python; the
      # server and router `gf serve` runs ride inside the package, off PATH.
      - if: runner.os == 'macOS'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - if: runner.os == 'macOS'
        run: |
          cargo build --release --locked -p gf-cli --bin gf -p gf-server --bin gf-server -p gf-router --bin gf-router
          mkdir -p wheel-data/scripts
          cp target/release/gf wheel-data/scripts/gf-native
          mkdir -p src/generalforecast/bin
          cp target/release/gf-server target/release/gf-router src/generalforecast/bin/
          sed -i '' 's/^# data = "wheel-data"/data = "wheel-data"/' pyproject.toml
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --locked --out dist
          before-script-linux: |
            cargo build --release --locked -p gf-cli --bin gf -p gf-server --bin gf-server -p gf-router --bin gf-router
            mkdir -p wheel-data/scripts
            cp target/release/gf wheel-data/scripts/gf-native
            mkdir -p src/generalforecast/bin
            cp target/release/gf-server target/release/gf-router src/generalforecast/bin/
            sed -i 's/^# data = "wheel-data"/data = "wheel-data"/' pyproject.toml
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.8.0"
      - name: Install the wheel and run what it carries
        run: |
          uv venv smoke
          uv pip install --python smoke/bin/python dist/*.whl
          smoke/bin/gf --help
          smoke/bin/gf-native --help
          smoke/bin/gf serve --help
          for server in gf-server gf-router; do
            test ! -e "smoke/bin/$server"
            "$(smoke/bin/python -c "from generalforecast.serve.listener import binary; print(binary('$server'))")" --help
          done
      # The README's example, end to end on the wheel's own engine.
      - name: Fit and predict with the wheel
        run: |
          uv pip install --python smoke/bin/python "$(ls dist/*.whl)[sklearn]"
          smoke/bin/python scripts/readme_example.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  assets:
    needs: [wheels, slow]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: Attach the wheels to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.whl --clobber --repo "$GITHUB_REPOSITORY"

  pypi:
    needs: [wheels, slow]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/generalforecast/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # Each released model's programs compiled for each platform, signed, beside
  # the weights on Hugging Face, so a fresh machine's first call starts warm.
  # Bundles are keyed by the traced code and JAX, so a release that changes
  # neither finds its bundles already there and builds nothing.
  compiled:
    needs: [wheels, slow]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: dist
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.8.0"
      - name: Compile and sign the programs
        env:
          GF_COMPILED_SIGNING_KEY: ${{ secrets.GF_COMPILED_SIGNING_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv venv --python 3.12 compiled
          uv pip install --python compiled/bin/python "$(ls dist/*.whl)[sklearn]"
          compiled/bin/python -m generalforecast.runtime.shipped bundles
      - if: startsWith(github.ref, 'refs/tags/v') && hashFiles('bundles/**') != ''
        name: Upload the bundles
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          compiled/bin/hf upload general-forecast/compiled bundles . \
            --commit-message "$GITHUB_REF_NAME ${{ matrix.target }}"
