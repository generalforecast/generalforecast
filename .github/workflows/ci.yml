name: CI

# Actions minutes are a budget, so CI runs at a few moments rather than on
# every commit:
# - a pull request into main when it is opened or marked ready for review;
#   drafts and stacked PRs based on other branches run nothing;
# - on request: add the `ci` label to a PR (remove and add it to run again),
#   or run the workflow by hand on any branch;
# - pushes to main, unless the merged PR already passed on the same tree;
# - from release.yml, which runs every job before it builds wheels.
# Changes to documentation alone run nothing, and each job but the Python
# checks and tests runs only when code it checks changes. The server and router
# integration tests, which build both binaries and start processes, run
# whenever the Rust crates or the Python they serve change. Every test runs
# here, split over runners so that each job takes about eight minutes; only
# the reference parity tests, which need the gated checkpoints, run weekly.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, labeled]
    paths-ignore: ["**.md"]
  workflow_dispatch:
  # The release workflow runs these checks before it builds wheels.
  workflow_call:
    inputs:
      everything:
        description: Run every job, whatever changed
        type: boolean
        default: true

# A newer run for the same PR or branch cancels the older one; adding any
# other label gets a group of its own, so it cannot cancel a real run, and
# so does a release's run, which a push to its branch must not cancel.
concurrency:
  group: >-
    ${{ (inputs.everything ||
    (github.event.action == 'labeled' && github.event.label.name != 'ci')) &&
    format('ci-run-{0}', github.run_id) ||
    format('ci-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

jobs:
  # Decides which jobs run, from the API alone so it needs no checkout.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci'))
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
      python: ${{ steps.decide.outputs.python }}
      serving: ${{ steps.decide.outputs.serving }}
      typescript: ${{ steps.decide.outputs.typescript }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
          # Set only when release.yml calls this workflow.
          EVERYTHING: ${{ inputs.everything == true }}
        run: |
          rust=true python=true serving=true typescript=true
          if [ "$EVERYTHING" = true ]; then
            echo "called to run every job"
          elif [ "$EVENT" = pull_request ]; then
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
            grep -qE '^(crates/|Cargo\.|rust-toolchain|\.github/workflows/ci\.yml)' <<<"$files" || rust=false
            # The binaries, the Python workers and engine they start, and the tests' harness.
            grep -qE '^(crates/|Cargo\.|rust-toolchain|src/generalforecast/|tests/(conftest|test_server|test_router|test_remote|test_placement|test_estimators|test_cli)\.py|tests/(utils|models|serve)/|pyproject\.toml|uv\.lock|\.github/workflows/ci\.yml)' <<<"$files" || serving=false
            grep -qE '^(clients/typescript/|api/|\.github/workflows/ci\.yml)' <<<"$files" || typescript=false
          elif [ "$EVENT" = push ]; then
            # A merge whose tree is the PR head's repeats checks that passed.
            pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty')
            if [ -n "$pr" ]; then
              head=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
              tree() { gh api "repos/$REPO/git/commits/$1" --jq .tree.sha; }
              if [ "$(tree "$SHA")" = "$(tree "$head")" ]; then
                passed=false
                for run in $(gh api "repos/$REPO/actions/runs?head_sha=$head&event=pull_request" \
                    --jq '.workflow_runs[] | select(.name == "CI" and .conclusion == "success") | .id'); do
                  # Every part of the Python tests ran and passed.
                  if gh api "repos/$REPO/actions/runs/$run/jobs" \
                      --jq '[.jobs[] | select(.name | startswith("python")) | .conclusion]
                        | length > 0 and all(. == "success")' | grep -qx true; then
                    passed=true
                  fi
                done
                if $passed; then
                  rust=false python=false serving=false typescript=false
                  echo "PR #$pr passed on this tree"
                fi
              fi
            fi
          fi
          echo "rust=$rust python=$python serving=$serving typescript=$typescript"
          {
            echo "rust=$rust"
            echo "python=$python"
            echo "serving=$serving"
            echo "typescript=$typescript"
          } >>"$GITHUB_OUTPUT"

  # The checks run side by side, so a run takes as long as the slowest one.
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Dependencies and build outputs carry over from main's last run; only
      # main saves them, so pull requests cannot crowd out its cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # gf-py's test binary would link against libpython; the Python job
      # tests the extension it builds instead.
      # The Python job runs the CLI's tests, tests/product_cli among them,
      # whenever this one runs.
      - run: cargo test --workspace --exclude gf-py

  # The checks, and the tests not marked slow in three parts, each on its
  # own runner's four cores.
  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: matrix.part == 1
        run: python scripts/spdx.py --check
      # uv sync builds the Rust extension, as the slow job's does.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: python
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.8.0"
          enable-cache: true
      - run: uv sync --locked
      - if: matrix.part == 1
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run ty check
      # JAX's compile cache from this part's last run on main: a program
      # whose code did not change loads instead of compiling, which takes
      # most of these tests' time on a cold cache.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/generalforecast/jax
          key: jax-${{ github.job }}-${{ matrix.part }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: jax-${{ github.job }}-${{ matrix.part }}-${{ hashFiles('uv.lock') }}-
      - run: uv run pytest -m "not slow" -n auto --shard ${{ matrix.part }}/3 --durations=10
      # Saved from runs outside pull requests, so those cannot crowd out main's.
      - if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/generalforecast/jax
          key: jax-${{ github.job }}-${{ matrix.part }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}

  # The tests marked slow that start no server, which compile the tiny
  # models, in eight parts at three workers a runner: a test process grows
  # by a few GB over the tests it runs, and five parts ran a runner out of
  # memory. A test that runs ten minutes prints every thread's stack.
  slow:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: python
          save-if: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.8.0"
          enable-cache: true
      - run: uv sync --locked
      # JAX's compile cache from this part's last run on main: a program
      # whose code did not change loads instead of compiling, which takes
      # most of these tests' time on a cold cache.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/generalforecast/jax
          key: jax-${{ github.job }}-${{ matrix.part }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: jax-${{ github.job }}-${{ matrix.part }}-${{ hashFiles('uv.lock') }}-
      - run: >-
          uv run pytest -m "slow and not server and not router" -n 3
          --shard ${{ matrix.part }}/8 --durations=10
          -o faulthandler_timeout=600
      # Saved from runs outside pull requests, so those cannot crowd out main's.
      - if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/generalforecast/jax
          key: jax-${{ github.job }}-${{ matrix.part }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}

  # Tests marked server or router start gf-server and gf-router processes;
  # those also marked slow run here, in five parts beside the other jobs
  # rather than after them, and only when what they exercise changed. Three
  # workers leave a core to the servers, whose failover waits on timers.
  serving:
    needs: changes
    if: needs.changes.outputs.serving == 'true'
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.8.0"
          enable-cache: true
      - run: uv sync --locked
      - run: cargo build -p gf-server -p gf-router
      # JAX's compile cache from this part's last run on main: a program
      # whose code did not change loads instead of compiling, which takes
      # most of these tests' time on a cold cache.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/generalforecast/jax
          key: jax-${{ github.job }}-${{ matrix.part }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: jax-${{ github.job }}-${{ matrix.part }}-${{ hashFiles('uv.lock') }}-
      - run: >-
          uv run pytest -m "(server or router) and slow" -n 3
          --shard ${{ matrix.part }}/5 --durations=10
          -o faulthandler_timeout=600
      # Saved from runs outside pull requests, so those cannot crowd out main's.
      - if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/generalforecast/jax
          key: jax-${{ github.job }}-${{ matrix.part }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}

  # Replays api/openapi.yaml's examples, and checks real predictions'
  # meaning, against a gf serve stack on the tiny test models, so a reply
  # that drifts from the spec fails here rather than in a client.
  conformance:
    needs: changes
    if: needs.changes.outputs.serving == 'true' || needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.8.0"
          enable-cache: true
      - run: uv sync --locked
      - run: cargo build -p gf-server
      # The stack prints one JSON line once it answers /readyz, after its
      # worker compiles; the suite runs against it, then it is stopped.
      - name: Replay the spec against gf serve
        run: |
          uv run python scripts/conformance_server.py --binary target/debug/gf-server >server.json &
          stack=$!
          until [ -s server.json ]; do
            kill -0 "$stack" || exit 1
            sleep 2
          done
          GF_CONFORMANCE_URL=$(jq -r .url server.json)
          GF_CONFORMANCE_TOKEN=$(jq -r .token server.json)
          GF_CONFORMANCE_PROJECT=$(jq -r .project server.json)
          export GF_CONFORMANCE_URL GF_CONFORMANCE_TOKEN GF_CONFORMANCE_PROJECT
          status=0
          uv run pytest -m conformance tests/conformance || status=$?
          kill "$stack"
          wait "$stack" || true
          exit "$status"

  typescript:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
      - run: npm ci
      # Builds the client, then checks it against the spec's examples.
      - run: npm test
