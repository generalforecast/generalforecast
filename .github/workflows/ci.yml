name: CI

# Actions minutes are a budget, so CI runs at a few moments rather than on
# every commit:
# - pushes to main, where a newer push cancels the run still going, so merging
#   a stack checks only its last commit;
# - a pull request into main when it is opened or marked ready for review;
#   drafts and stacked PRs based on other branches run nothing;
# - on request: add the `ci` label to a PR (remove and add it to run again),
#   or run the workflow by hand on any branch.
# Changes to documentation alone run nothing.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, labeled]
    paths-ignore: ["**.md"]
  workflow_dispatch:
  # The release workflow runs these checks before it publishes wheels.
  workflow_call:

# A newer run for the same PR or branch cancels the older one; adding any
# other label gets a group of its own, so it cannot cancel a real run.
concurrency:
  group: >-
    ${{ github.event.action == 'labeled' && github.event.label.name != 'ci' &&
    github.run_id || format('ci-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

# Two jobs run side by side, so a run takes as long as the slower one.
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Dependencies and build outputs carry over from main's last run; only
      # main saves them, so pull requests cannot crowd out its cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -p gf-core -p gf-server -p gf-router -p gf-cli
      - run: cargo build -p gf-cli --bins
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.8.0"
      - run: uv sync --locked
      - run: GF_CLI="$PWD/target/debug/gf" uv run pytest tests/product_cli -m "not slow"

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # uv sync builds the Rust extension.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.8.0"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      # Tests that compile models or start servers are marked slow and run
      # locally with a plain pytest; on CI's 2-core runner they take most of
      # an hour.
      - run: uv run pytest -m "not slow"
