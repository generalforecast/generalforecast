name: Weekly

# Tests marked slow compile models or start servers, so they run once a week
# instead of on every pull request, and release.yml runs them before it
# publishes.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.8.0"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m slow -n auto
