# A native gf cluster on SkyPilot. It requires an image that ships gf, with
# gf-server and gf-router; setup refuses any image that is not digest-pinned
# or lacks either binary.
#
# A gf cluster on SkyPilot: every machine runs a node from a native image,
# with one worker per GPU, and the first also runs the router that clients
# connect to on port 8815. The router fails a table's writes over to its other
# replica once its primary has been out of reach for 10 seconds.
#
# Put certificates from your certificate authority in deploy/certs:
# authority.pem, node.pem and node.key (for the name gf-node), router.pem and
# router.key (for gf-router), and router-client.pem and router-client.key (a
# client certificate nodes accept from the router). Then launch with fresh
# secrets, and keep them: clients need GF_TOKEN, and the logs on disk cannot be
# read without GF_LOG_KEY. Pass the native image by digest with
# --env GF_IMAGE=<registry>/<name>@sha256:<digest>.
#
#   uvx --from "skypilot[gcp]==0.14.0" sky launch -c gf deploy/native-cluster.yaml \
#       --env GF_IMAGE=... \
#       --secret GF_TOKEN=$(openssl rand -hex 32) \
#       --secret GF_REPLICATION_TOKEN=$(openssl rand -hex 32) \
#       --secret GF_LOG_KEY=$(openssl rand -hex 32)
#
# The cluster speaks native RPC to `gf.engine` clients, not the HTTP API.
#
# Large fits reach the workers through shared memory, so containers get
# --shm-size well above Docker's 64 MiB default.
#
# Only the router's port is open to the internet; the router and nodes use
# mutual TLS inside the network, and each table keeps three replicas. Machines
# need Docker with the NVIDIA container toolkit, as SkyPilot's GPU images have.

name: gf

num_nodes: 3

resources:
  infra: gcp
  accelerators: L4:1
  ports: 8815

file_mounts:
  ~/checkpoints/tabicl-v2-classifier: checkpoints/tabicl-v2-classifier
  ~/checkpoints/tabicl-v2-regressor: checkpoints/tabicl-v2-regressor
  ~/gf/certs/authority.pem: deploy/certs/authority.pem
  ~/gf/certs/node.pem: deploy/certs/node.pem
  ~/gf/certs/node.key: deploy/certs/node.key
  ~/gf/certs/router.pem: deploy/certs/router.pem
  ~/gf/certs/router.key: deploy/certs/router.key
  ~/gf/certs/router-client.pem: deploy/certs/router-client.pem
  ~/gf/certs/router-client.key: deploy/certs/router-client.key

envs:
  GF_IMAGE: ""
  GF_REPLICAS: 3

secrets:
  GF_TOKEN: null
  GF_REPLICATION_TOKEN: null
  GF_LOG_KEY: null

setup: |
  set -euo pipefail
  case "$GF_IMAGE" in
    *@sha256:????????????????????????????????????????????????????????????????) ;;
    *) echo "GF_IMAGE must be a digest-pinned native image" >&2; exit 1 ;;
  esac
  docker pull "$GF_IMAGE"
  docker run --rm --network none --entrypoint sh "$GF_IMAGE" \
      -c 'python -c "from generalforecast.serve import listener as l; l.binary(\"gf-server\"); l.binary(\"gf-router\")"' >/dev/null \
      || { echo "GF_IMAGE lacks gf-server or gf-router" >&2; exit 1; }

run: |
  set -euo pipefail
  certs=/etc/gf/certs
  chmod 600 "$HOME"/gf/certs/*.key
  mkdir -p "$HOME/gf/data"
  umask 077
  cat > "$HOME/gf/gf.toml" <<EOF
  listen = "0.0.0.0:8816"
  metrics_listen = "127.0.0.1:9090"
  data = "/var/lib/gf"
  tokens = []
  replication_tokens = ["$GF_REPLICATION_TOKEN"]
  require_lease = true
  encryption_key_env = "GF_LOG_KEY"

  [tls]
  certificate = "$certs/node.pem"
  key = "$certs/node.key"
  client_ca = "$certs/authority.pem"

  [[workers]]
  command = ["/opt/gf/bin/python", "-m", "generalforecast.worker_process"]
  per_gpu = true
  models = { "general-forecast/tabicl-v2-classifier" = "general-forecast/tabicl-v2-classifier", "general-forecast/tabicl-v2-regressor" = "general-forecast/tabicl-v2-regressor" }
  EOF

  # Containers run as this user, so they can read the keys and write the logs,
  # and Docker starts each again if it stops, apart from the other. Compiled
  # programs stay on the data volume, so a container started again skips most
  # compiling.
  gf() {
    docker run -d --restart unless-stopped --network host --user "$(id -u):$(id -g)" \
        --shm-size=8g -e HOME=/tmp -e GF_LOG_KEY -e XDG_CACHE_HOME=/var/lib/gf/xdg \
        -e GF_CHECKPOINTS=/checkpoints -v "$HOME/checkpoints:/checkpoints:ro" \
        -v "$HOME/gf:/etc/gf:ro" -v "$HOME/gf/data:/var/lib/gf" "$@"
  }
  docker rm -f gf-node gf-router 2>/dev/null || true
  gf --gpus all --name gf-node --entrypoint gf "$GF_IMAGE" \
      admin node serve --config /etc/gf/gf.toml

  if [ "$SKYPILOT_NODE_RANK" = 0 ]; then
    {
      printf 'listen = "0.0.0.0:8815"\nmetrics_listen = "127.0.0.1:9091"\nname = "router-0"\n'
      printf 'replicas = %s\nfailover_seconds = 10\n\n' "$GF_REPLICAS"
      printf '[[clients]]\ntoken = "%s"\n\n' "$GF_TOKEN"
      printf '[tls]\ncertificate = "%s/router.pem"\nkey = "%s/router.key"\n' "$certs" "$certs"
      rank=0
      for ip in $SKYPILOT_NODE_IPS; do
        printf '\n[[nodes]]\nname = "node-%s"\naddress = "https://%s:8816"\n' "$rank" "$ip"
        printf 'token = "%s"\nca = "%s/authority.pem"\ndomain = "gf-node"\n' "$GF_REPLICATION_TOKEN" "$certs"
        printf 'certificate = "%s/router-client.pem"\nkey = "%s/router-client.key"\n' "$certs" "$certs"
        rank=$((rank + 1))
      done
    } > "$HOME/gf/router.toml"
    gf --name gf-router -e GF_HEALTH_PORT=9091 --entrypoint gf "$GF_IMAGE" \
        admin router serve --config /etc/gf/router.toml
  fi
  # The job lasts as long as the node's logs, through its restarts.
  exec docker logs -f gf-node
