[package]
name = "gf-py"
description = "Python bindings for gf-core, built as generalforecast._core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
gf-core = { path = "../gf-core" }
numpy = "0.29"
pyo3 = { version = "0.29", features = ["abi3-py312"] }

[lints]
workspace = true
